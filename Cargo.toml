[package]
name = "cargo-generate-service"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
config = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
url = "2.5"
env_logger = "0.10"
thiserror = "1.0"
log = "0.4"
lazy_static = "1.4"
cargo-generate = "0.22.1"