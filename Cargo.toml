[package]
name = "cargo-generate-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-governor = "0.6"
config = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
prometheus-client = "0.21"
dotenv = "0.15"
url = "2.5"
env_logger = "0.10"
thiserror = "1.0"
log = "0.4"
lazy_static = "1.4"